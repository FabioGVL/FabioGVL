<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030604"/>
      <stop offset="55%" stop-color="#080d09"/>
      <stop offset="100%" stop-color="#020302"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cf03d"/>
      <stop offset="100%" stop-color="#24d96b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16391f" stroke-width="0.7" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.55"/>

  <g opacity="0.55" stroke="#39e76f" fill="none">
    <path d="M0 70 H180 L220 30 H410" stroke-width="1.5"/>
    <path d="M0 250 H145 L190 205 H350" stroke-width="1.2"/>
    <path d="M790 38 H1010 L1050 78 H1200" stroke-width="1.2"/>
    <path d="M760 260 H930 L985 205 H1200" stroke-width="1.5"/>
    <circle cx="220" cy="30" r="4" fill="#39e76f"/>
    <circle cx="985" cy="205" r="4" fill="#39e76f"/>
  </g>

  <g transform="translate(72 88)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#f4f7f4"
      font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Fábio</text>
    <text x="168" y="0" dominant-baseline="hanging" fill="url(#green)"
      font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Gabriel</text>
    <rect x="372" y="8" width="3" height="55" rx="1.5" fill="#7cf03d" filter="url(#glow)"/>

    <text x="0" y="86" fill="#d9e0da" font-family="Segoe UI, Arial, sans-serif" font-size="25">
      QA Analyst  |  Test Automation  |  API Testing  |  CI/CD
    </text>
    <text x="0" y="132" fill="#8fa497" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      Cypress  •  Playwright  •  Selenium  •  JavaScript  •  Python  •  Java
    </text>
  </g>

  <g transform="translate(845 74)" stroke="#7cf03d" fill="none">
    <rect x="0" y="0" width="285" height="170" rx="14" fill="#071009" stroke="#244d2e"/>
    <path d="M34 45 h16 l8 8 20-24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="94" y="51" fill="#b7c8bc" stroke="none" font-family="monospace" font-size="17">UI TESTS</text>
    <text x="218" y="51" fill="#7cf03d" stroke="none" font-family="monospace" font-size="17">PASS</text>

    <path d="M34 83 h16 l8 8 20-24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="94" y="89" fill="#b7c8bc" stroke="none" font-family="monospace" font-size="17">API TESTS</text>
    <text x="218" y="89" fill="#7cf03d" stroke="none" font-family="monospace" font-size="17">PASS</text>

    <path d="M34 121 h16 l8 8 20-24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="94" y="127" fill="#b7c8bc" stroke="none" font-family="monospace" font-size="17">E2E TESTS</text>
    <text x="218" y="127" fill="#7cf03d" stroke="none" font-family="monospace" font-size="17">PASS</text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1d3b24"/>
</svg>